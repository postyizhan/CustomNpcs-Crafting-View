name: Publish to Modrinth

on:
  push:
    branches: [ '1.7.10' ]

# Single dual-compatible jar (original CustomNPCs + CustomNPC+). Every push to 1.7.10
# auto-publishes a Modrinth version named "{mcVersion}-{shortHash}", e.g. 1.7.10-8a4f47e.
# Re-pushing the same commit is skipped (Modrinth rejects duplicate version_number).

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Compute version (mcVersion-shortHash)
        id: version
        run: |
          MC_VERSION=$(grep -oP '(?<=^minecraftVersion\s=\s).+' gradle.properties | tr -d '[:space:]')
          SHORT_HASH=$(git rev-parse --short HEAD)
          VERSION="${MC_VERSION}-${SHORT_HASH}"
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Skip if version already exists on Modrinth
        id: dup
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_NUMBER: ${{ steps.version.outputs.version_number }}
        run: |
          EXISTING=$(curl -s -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/5skiXDDB/version" \
            | python3 -c "import json,sys,os; vs=json.load(sys.stdin); print(any(v['version_number']==os.environ['VERSION_NUMBER'] for v in vs))")
          if [ "$EXISTING" = "True" ]; then
            echo "Version $VERSION_NUMBER already published, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 25
        if: steps.dup.outputs.skip == 'false'
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        if: steps.dup.outputs.skip == 'false'
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Find and rename jar (tag MC version)
        if: steps.dup.outputs.skip == 'false'
        id: jar
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version_number }}
        run: |
          RAW=$(ls build/libs/*.jar | grep -v '\-dev\.' | grep -v '\-sources\.' | head -1)
          OUT="build/libs/customnpcs_crafting_view-${VERSION_NUMBER}.jar"
          cp "$RAW" "$OUT"
          echo "path=$OUT" >> $GITHUB_OUTPUT
          echo "Publishing jar: $OUT"

      - name: Publish to Modrinth
        if: steps.dup.outputs.skip == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ github.event.head_commit.message }}
          VERSION_NUMBER: ${{ steps.version.outputs.version_number }}
          GAME_VERSION: ${{ steps.version.outputs.mc_version }}
        run: |
          JAR="${{ steps.jar.outputs.path }}"
          DATA=$(python3 -c "
          import json, os
          print(json.dumps({
            'project_id': '5skiXDDB',
            'version_number': os.environ['VERSION_NUMBER'],
            'name': os.environ['VERSION_NUMBER'],
            'version_type': 'release',
            'game_versions': [os.environ['GAME_VERSION']],
            'loaders': ['forge'],
            'changelog': os.environ['CHANGELOG'],
            'dependencies': [{'project_id': 'ptXUpAzg', 'dependency_type': 'required'}],
            'featured': True,
            'file_parts': ['file']
          }))
          ")
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=$DATA" \
            -F "file=@$JAR;type=application/java-archive")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
